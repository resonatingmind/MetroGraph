name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,    os: ubuntu-24.04, cxx: g++ }
          - { name: linux-clang,  os: ubuntu-24.04, cxx: clang++ }
          - { name: windows-msvc, os: windows-2022, cxx: cl }
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        run: cmake --preset release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DMETROGRAPH_WERROR=ON
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release

  sanitizers:
    name: linux-clang-asan-ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure
        run: cmake --preset asan -DCMAKE_CXX_COMPILER=clang++ -DMETROGRAPH_WERROR=ON
      - name: Build
        run: cmake --build --preset asan
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --preset asan
